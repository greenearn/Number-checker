<script>
        let selectedTaskType = "tg_active";
        const BACKEND_URL = "https://trangle141-number-checker-backend.hf.space"; // NO trailing slash!

        function selectService(taskType, title) {
            selectedTaskType = taskType;
            document.getElementById('current-service-title').innerText = title;
        }

        async function startTaskSubmission() {
            const fileInput = document.getElementById('batch_file');
            if (fileInput.files.length === 0) {
                alert("Please select a file first.");
                return;
            }

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);
            formData.append("task_type", selectedTaskType);
            formData.append("user_id", "demo-user-123");

            const statusBox = document.getElementById('status-box');
            const statusText = document.getElementById('status-text');
            const resultOutput = document.getElementById('result-output');
            
            statusBox.classList.remove('hidden');
            statusText.innerText = "⏳ Connecting to backend & submitting task...";
            resultOutput.innerText = "";

            try {
                const res = await fetch(`${BACKEND_URL}/api/submit-task`, {
                    method: "POST",
                    body: formData
                });

                const responseText = await res.text();
                let data;
                try {
                    data = JSON.parse(responseText);
                } catch (e) {
                    throw new Error("Server is waking up or returned HTML: " + responseText.substring(0, 100));
                }
                
                if (res.ok) {
                    statusText.innerText = "✅ Task successfully queued!";
                    resultOutput.innerText = JSON.stringify(data, null, 2);
                } else {
                    statusText.innerText = "❌ Error from CheckNumber API";
                    resultOutput.innerText = data.detail || JSON.stringify(data);
                }
            } catch (err) {
                statusText.innerText = "❌ Connection Error";
                resultOutput.innerText = err.message + "\n\nTip: Make sure your Hugging Face Space status is 'Running'!";
            }
        }
    </script>
